name: Build MS COLLECTION APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'MS_COLLECTION_Billing_v1.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          rm -rf MS_COLLECTION_Billing
          mkdir MS_COLLECTION_Billing
          unzip -q MS_COLLECTION_Billing_v1.zip -d MS_COLLECTION_Billing
          ls -la MS_COLLECTION_Billing

      - name: Build debug APK
        working-directory: MS_COLLECTION_Billing
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MS-COLLECTION-debug-APK
          path: MS_COLLECTION_Billing/app/build/outputs/apk/debug/app-debug.apk
