name: Build MS COLLECTION V2 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract V2 project
        run: |
          rm -rf source
          mkdir source
          unzip -q "MS_COLLECTION_Billing_v2 (1).zip" -d source

      - name: Find Android project
        run: |
          PROJECT_DIR=$(dirname "$(find source -name settings.gradle -print -quit)")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project at: $PROJECT_DIR"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug

      - name: Copy APK
        run: |
          mkdir -p build-output
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" build-output/MS-COLLECTION-v2.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MS-COLLECTION-v2-APK
          path: build-output/MS-COLLECTION-v2.apk
          
